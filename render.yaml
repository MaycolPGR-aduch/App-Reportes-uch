# Despliegue del backend en Render.
#
# La base de datos NO se declara aquí: vive en Neon y se conecta con DATABASE_URL.
# Las evidencias tampoco: van a un almacén compatible con S3 (Cloudflare R2), por
# lo que este servicio no necesita disco y puede correr en el plan gratuito.
services:
  - type: web
    name: campus-alertas-api
    # `runtime` es el nombre actual del campo; `env` era el antiguo.
    runtime: python
    # Sin `plan` explicito Render asume una instancia de pago y exige tarjeta
    # antes de dejar crear el Blueprint.
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migra, levanta los tres trabajadores y luego la API. Ver start.sh.
    startCommand: bash ./start.sh
    healthCheckPath: /health/ready
    envVars:
      # --- entorno ---------------------------------------------------------
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"

      # --- base de datos (Neon) --------------------------------------------
      # Cadena de Neon con ?sslmode=require. Secreta: se pega en el panel.
      - key: DATABASE_URL
        sync: false

      # --- sesiones y origen -----------------------------------------------
      - key: JWT_SECRET
        generateValue: true
      # Sin esto el arranque falla a propósito en producción. Debe ser la URL
      # exacta del frontend en Vercel, con https y sin barra final.
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # El frontend (Vercel) y la API (Render) están en dominios distintos, así
      # que la cookie de sesión tiene que viajar entre sitios.
      - key: COOKIE_SAMESITE
        value: none
      - key: JWT_EXP_MINUTES
        value: "60"
      - key: SESSION_COOKIE_NAME
        value: campus_session
      - key: CSRF_COOKIE_NAME
        value: campus_csrf
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false

      # --- almacenamiento de evidencias (Cloudflare R2) --------------------
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_PREFIX
        value: evidences
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: MAX_IMAGE_PIXELS
        value: "25000000"

      # --- anti-abuso -------------------------------------------------------
      # Turnstile rechaza con 403 si se exige sin clave configurada: el reporte
      # anónimo dejaría de funcionar. Poner "true" solo tras cargar la clave.
      - key: REQUIRE_TURNSTILE
        value: "false"
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_LOGIN
        value: "5"
      - key: RATE_LIMIT_PUBLIC_REPORT
        value: "3"

      # --- capa de IA (TokenRouter) ----------------------------------------
      - key: AI_TOKENROUTER_API_KEY
        sync: false
      - key: AI_TOKENROUTER_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: AI_IMAGE_PRIMARY_MODEL
        sync: false
      - key: AI_IMAGE_FALLBACK_MODELS
        sync: false
      - key: AI_PROMPT_VERSION
        value: v1
      # MANUAL | AI_ASSISTED | RANDOM. Se estampa en cada incidencia al crearla.
      - key: GOVERNANCE_MODE
        value: AI_ASSISTED
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1024"

      # --- correo (Brevo) ---------------------------------------------------
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Campus Alertas
      - key: DEFAULT_ALERT_EMAIL
        sync: false
      - key: DASHBOARD_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

      # --- avisos automáticos ----------------------------------------------
      - key: ALERTS_ENABLED
        value: "true"
      - key: ALERT_SILENCE_HOURS
        value: "6"
      - key: MONITOR_INTERVAL_MINUTES
        value: "15"
      - key: REPORTER_UPDATES_ENABLED
        value: "true"

      # --- trabajadores y retención ----------------------------------------
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: CLASSIFICATION_RETRY_DELAY_SECONDS
        value: "120"
      - key: NOTIFICATION_RETRY_DELAY_SECONDS
        value: "60"
      - key: JOB_LEASE_SECONDS
        value: "300"
      - key: RETENTION_DAYS
        value: "180"
