name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_ci -d campus_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://campus_ci:ci-only-password@127.0.0.1:5432/campus_ci
      RUN_LOCAL_PG_COMMUNITY_TEST: "1"
      RUN_LOCAL_PG_SESSION_TEST: "1"
      RUN_LOCAL_PG_HARDENING_TEST: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: python -m compileall app -q
      - run: python -m pytest tests -q
      - run: alembic -c alembic.ini heads
      - run: alembic -c alembic.ini upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm audit --omit=dev
      - run: npm run build
